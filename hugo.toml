baseURL = "https://startfromlin.netlify.app/"
languageCode = "en-us"
title = "Start From Lin"
theme = "hugo-myportfolio-theme"

[params]
  description = "Personal blog, portfolio, and social portal for Start From Lin."
  enableSEO = true
  custom_css_vars = ["custom_vars.css"]
  custom_css = ["site.css", "blog.css"]

  [params.social]
    preview_image = ""

  [params.homepage]
    sections = ["home", "about", "latest-posts", "featured-projects", "connect"]

  [params.navigation]
    brand = "Start From Lin"

  [params.navigation.links]
    home = "HOME"
    about = "ABOUT"
    latest-posts = "BLOG"
    featured-projects = "PROJECTS"
    connect = "CONNECT"

#########################################
# HOME SECTION
#########################################
[params.home]
  title = "Start From Lin"
  background_opacity = 40

#########################################
# ABOUT SECTION
#########################################
[params.about]
  title = "ABOUT"
  profile_text = "Hi, I'm Claire!"
  main_text = "A creator and IT student based in Brisbane — sharing my_"